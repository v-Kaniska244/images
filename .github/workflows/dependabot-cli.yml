name: Dependabot CLI

on:
  workflow_dispatch:
    inputs:
      target:
        description: Dependency set to update
        required: true
        type: choice
        default: all
        options:
          - all
          - github-actions
          - npm
          - docker
          - devcontainers

concurrency:
  group: dependabot-cli
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: repo
          persist-credentials: false

      - name: Download Dependabot CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          gh release download \
            --repo dependabot/cli \
            --pattern '*linux-amd64.tar.gz' \
            --output dependabot.tar.gz

          tar -xzf dependabot.tar.gz
          chmod +x ./dependabot
          ./dependabot --version

      - name: Run dependency updates
        env:
          TARGET: ${{ inputs.target }}
          GITHUB_TOKEN: ${{ github.token }}
          LOCAL_GITHUB_ACCESS_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          mkdir -p jobs
          : > result.jsonl
          failures=0

          run_update() {
            local manager="$1"
            local directory="$2"
            local group="$3"
            local slug="$4"
            local job_file="jobs/${slug}.yml"
            local attempt_file="jobs/${slug}.jsonl"
            local success=0

            cat > "$job_file" <<EOF
          job:
            package-manager: ${manager}
            allowed-updates:
              - update-type: all
            dependency-groups:
              - name: ${group}
                rules:
                  patterns:
                    - "*"
            source:
              provider: github
              repo: ${GITHUB_REPOSITORY}
              directory: ${directory}
              commit: ${GITHUB_SHA}
          EOF

            echo "::group::Dependabot ${manager} ${directory}"

            for attempt in 1 2 3 4 5; do
              : > "$attempt_file"

              if ./dependabot update \
                -f "$job_file" \
                --local repo \
                --timeout 20m > "$attempt_file"; then
                cat "$attempt_file" >> result.jsonl
                success=1
                break
              fi

              if (( attempt < 5 )); then
                echo "::warning::Dependabot failed for ${manager} at ${directory}; retrying"
                sleep 20
              fi
            done

            if (( success == 0 )); then
              echo "::error::Dependabot failed for ${manager} at ${directory}"
              failures=1
            fi

            echo "::endgroup::"
          }

